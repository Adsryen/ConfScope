name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 出包前的同一道闸门（轮52）。轮50/51 两次事故都是"链路里一环坏了但没人报错"：
  # 数据绑定命名空间漂了静默降级、-X 注入打不到 Go 声明静默忽略，两者在编译期/一次单测里
  # 就能拦住，可整条发版链路一条检查都不跑——vite/esbuild 只剥类型不做类型检查。
  # 所以 build 现在 needs 这个作业：判据不过，四个平台连编都不编。
  # 人在本地打 tag 前跑 scripts/verify-release-version.sh，CI 在同一个 commit 上用同一份判据
  # 再跑一遍，两边不是两套口径。
  preflight:
    runs-on: ubuntu-22.04
    name: Preflight (typecheck · guards · go · version inject)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # 锁文件与 package.json 同步（本轮实测 pnpm install --frozen-lockfile 干净目录 exit 0），
      # 所以这里用 frozen：装出来的依赖漂移要在出包前就红，而不是四个平台各装各的。
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      # 生产守卫（脚手架不得混进产物）跟着前端构建一起跑，别等到平台作业才发现
      - name: Build web bundle
        run: pnpm build:web

      - name: Static guards and unit tests
        run: pnpm exec vitest run tests/ux

      - name: Go format gate
        shell: bash
        run: |
          # 排除 node_modules：里面躺着第三方 .go，不该由本仓库的格式判据负责
          UNFORMATTED="$(find . -name '*.go' -not -path './node_modules/*' -print0 | xargs -0 -r gofmt -l)"
          if [ -n "${UNFORMATTED}" ]; then
            echo "以下 Go 文件不是 gofmt 形态，先 gofmt -w 归位：" >&2
            echo "${UNFORMATTED}" >&2
            exit 1
          fi

      - name: Go vet and tests
        shell: bash
        run: |
          go vet ./internal/...
          go test ./internal/...

      # Windows 安装包脚本的语法闸门（轮62）。project.nsi 是手写的，而它过去只在
      # Windows 的 wails build -nsis 里第一次被编译——CI 从来不产安装包，等于从来没验证过，
      # 语法错/宏顺序错/语言表缺失都要等到出包作业才炸。这里用发行版自带的 nsis 包
      # （和 wails 调用的同一支 makensis）在 Linux 上把它编译一遍。
      # 判据是硬的：装不到 makensis 就红，脚本没真吐出安装包也红——
      # check-windows-installer.sh 找不到 makensis 时是 SKIP + exit 0，不能让它蒙过去。
      - name: Validate Windows installer script (makensis)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y nsis
          command -v makensis >/dev/null
          rm -f build/bin/confscope-windows-amd64-installer.exe
          REQUIRE_STRING_CHECK=1 bash scripts/check-windows-installer.sh
          test -f build/bin/confscope-windows-amd64-installer.exe

      # 可执行证据：注入必须真的落进 internal/app（本轮线上事故的形态），不是只 grep 文本
      - name: Version injection evidence
        shell: bash
        run: |
          CONFSCOPE_EXPECT_APP_VERSION=9.9.9 go test -count=1 \
            -ldflags "-X confscope/internal/app.appVersion=9.9.9" \
            -run TestAppVersionInjectionLandsInThisPackage ./internal/app/

      - name: Release gate
        if: github.ref_type == 'tag'
        shell: bash
        # --skip-bundle：前端构建与生产守卫在上面一步已经跑过了，别在这里重编第二遍
        run: bash scripts/verify-release-version.sh --skip-bundle

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            goarch: amd64
          - os: windows-latest
            platform: windows
            goarch: amd64
          - os: macos-14
            platform: darwin
            goarch: arm64
          - os: macos-14
            platform: darwin
            goarch: amd64

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.platform }}-${{ matrix.goarch }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # Linux 需要 WebKit/GTK 开发库
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev

      # wails build -nsis 靠 PATH 上的 makensis；找不到时 v2.13.0 只打一行
      # "Warning: Cannot create installer: makensis not found" 然后 return nil
      # ——构建全绿、一个安装包都没有（本线最大的静默失败点）。所以这里显式装、
      # 显式定位，下面 Build 前再钉一次 PATH，产物存在性在上传前硬断言。
      - name: Install NSIS (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          choco install nsis -y --no-progress
          NSIS_BIN="$(find "/c/Program Files (x86)/NSIS" "/c/Program Files/NSIS" -maxdepth 1 -name makensis.exe 2>/dev/null | head -n 1 || true)"
          if [ -z "${NSIS_BIN}" ]; then
            echo "ERROR: choco 装完找不到 makensis.exe" >&2
            ls -la "/c/Program Files (x86)" || true
            exit 1
          fi
          "${NSIS_BIN}" -VERSION
          # GITHUB_PATH 要 Windows 形态的路径，bash 里的 /c/... 追加进去下一步用不了
          cygpath -w "$(dirname "${NSIS_BIN}")" | tr -d '\r' >> "${GITHUB_PATH}"

      - name: Install Wails CLI
        shell: bash
        run: |
          WAILS_VERSION="v2.13.0"
          if [ "${{ matrix.platform }}" = "darwin" ]; then
            # macOS: external link so the CLI binary gets LC_UUID (dyld requirement)
            go install -ldflags="-linkmode=external" "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}"
          else
            go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}"
          fi
          wails version

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            INSTALLER_VERSION="${VERSION}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
            # 非 tag 构建（workflow_dispatch）也要一个能过 VIProductVersion 的四段式数字，
            # 否则 makensis 直接在 "VIProductVersion "${INFO_PRODUCTVERSION}.0"" 上编译失败。
            INSTALLER_VERSION="0.0.0"
          fi
          echo "Building ConfScope version=${VERSION} GOARCH=${GOARCH}"
          NSIS_FLAG=""
          if [ "${{ matrix.platform }}" = "windows" ]; then
            # 安装包的版本号走的是另一条通道：wails 用自带模板渲染
            # build/windows/installer/wails_tools.nsh，把 wails.json 的 info.productVersion
            # 注入成 INFO_PRODUCTVERSION，再进 VIProductVersion / 卸载条目的 DisplayVersion /
            # install.json 的 version 字段。ldflags 只改 Go 里的 appVersion，改不到这里，
            # 所以每次出包都要按 tag 对齐一次，否则安装程序属性里永远是仓库里那个旧值。
            # wails.json 只在构建期被改，不落库（提交里仍是发版时写死的当前版本）。
            jq --arg v "${INSTALLER_VERSION}" '.info.productVersion = $v' wails.json > wails.json.tmp
            mv wails.json.tmp wails.json
            grep -q "\"productVersion\": \"${INSTALLER_VERSION}\"" wails.json
            command -v makensis >/dev/null || {
              echo "ERROR: makensis 不在 PATH，-nsis 会让 wails 只打 Warning 就返回成功" >&2
              exit 1
            }
            NSIS_FLAG="-nsis"
          fi

          # -X 的目标必须是变量真实所在的包路径：77fa451 把 appVersion 从 package main
          # 迁到 confscope/internal/app，写 main.appVersion 会被链接器静默忽略，
          # 产物里永远是 "dev"（钉在 tests/ux/buildVersionSymbolResolvesToGoDeclaration）。
          # shellcheck disable=SC2086
          wails build -clean ${NSIS_FLAG} -ldflags "-X confscope/internal/app.appVersion=${VERSION}"

          # 名字规范：全小写 + 平台 + 形态。wails 的产物名由 wails.json 的 outputfilename
          # 决定，而它必须和安装脚本里的 PRODUCT_EXECUTABLE 同源（装进去的可执行文件名），
          # 所以不改构建产物本身，只在上传前改名——update.json 的 fileName/downloadUrl
          # 与 release 资产跟着一起走，平台键（windows-amd64 等）一个字都不动，
          # 否则 ≤1.9.9 的客户端选不出条目，全员更新检查失效。
          if [ "${{ matrix.platform }}" = "windows" ]; then
            test -f build/bin/ConfScope.exe
            mv build/bin/ConfScope.exe build/bin/confscope-windows-amd64-portable.exe
          fi
        env:
          GOARCH: ${{ matrix.goarch }}

      # macOS 打包成 .dmg 安装镜像
      - name: Package macOS artifact
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find build/bin -maxdepth 2 -name '*.app' -type d | head -n 1 || true)"
          if [ -z "${APP_PATH}" ] || [ ! -d "${APP_PATH}" ]; then
            echo "ERROR: no .app bundle found under build/bin"
            ls -laR build/bin || true
            exit 1
          fi
          echo "Using app bundle: ${APP_PATH}"

          DMG_PATH="build/bin/confscope-macos-${{ matrix.goarch }}.dmg"
          rm -f "${DMG_PATH}"

          brew install create-dmg
          if create-dmg \
            --volname "ConfScope" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon "$(basename "${APP_PATH}")" 150 200 \
            --app-drop-link 450 200 \
            "${DMG_PATH}" \
            "${APP_PATH}"; then
            echo "create-dmg succeeded: ${DMG_PATH}"
          else
            echo "create-dmg failed; falling back to hdiutil"
            rm -f "${DMG_PATH}"
            hdiutil create \
              -volname "ConfScope" \
              -srcfolder "${APP_PATH}" \
              -ov \
              -format UDZO \
              "${DMG_PATH}"
          fi

          test -f "${DMG_PATH}"
          ls -lh "${DMG_PATH}"

      - name: Upload artifact (macOS)
        if: matrix.platform == 'darwin'
        uses: actions/upload-artifact@v4
        with:
          name: ConfScope-darwin-${{ matrix.goarch }}
          path: build/bin/confscope-macos-${{ matrix.goarch }}.dmg
          if-no-files-found: error

      - name: Upload artifact (Windows)
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ConfScope-windows-amd64
          path: build/bin/confscope-windows-amd64-portable.exe
          # 产物没编出来要在上传这一步就红；默认的 warn 会把它推到下游 sha256sum 才炸
          if-no-files-found: error

      # -nsis 静默失败的最后一道兜底（见上面 Install NSIS 的注释）：exe 编出来不代表
      # 安装包也编出来了。这里不写 || true，也不做「有就传没有就跳过」的容错——
      # 没有安装包就等于这一版的 Windows 用户点「下载并安装」时只会拿到一行提示。
      - name: Assert Windows installer exists
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          ls -la build/bin
          test -f build/bin/confscope-windows-amd64-installer.exe
          du -h build/bin/confscope-windows-amd64-installer.exe

      # 乱码判据只能在这条链路上生效：Windows 的 makensis 按宿主 ANSI 码页解释没有 BOM 的
      # 脚本，而 preflight 那套跑在 ubuntu（POSIX 侧恒按 UTF-8 读源码，原理上看不见这个缺陷）。
      # v1.9.9 就是 Linux 闸门全绿、线上安装包中文全是乱码。
      - name: Check Windows installer strings
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          # 两条都必须看到实际输出才算数：入口判定不成立时脚本会静默退出 0（Windows 上
          # process.argv[1] 是 D:\a\... 而 import.meta.url 是 file:///D:/a/...，
          # 早先那种逐字比对的写法在这条链路上恒假，闸门就成了空气）。
          node scripts/check-installer-strings.mjs --self-test | grep -E "^ok +.*blocks=[0-9]+ bad=[0-9]+"
          node scripts/check-installer-strings.mjs build/bin/confscope-windows-amd64-installer.exe | grep -E "UTF-16LE"

      - name: Upload artifact (Windows installer)
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ConfScope-windows-amd64-installer
          path: build/bin/confscope-windows-amd64-installer.exe
          if-no-files-found: error

      # Linux 打包原始二进制 + .deb + .rpm
      - name: Package Linux tarball
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          cd build/bin
          tar czf "confscope-linux-amd64.tar.gz" ConfScope
          echo "TARBALL=confscope-linux-amd64.tar.gz" >> $GITHUB_ENV

      - name: Package Linux .deb
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev.${GITHUB_SHA::7}"
          fi
          PKG="confscope_${VERSION}_amd64"
          mkdir -p "${PKG}/DEBIAN"
          mkdir -p "${PKG}/usr/bin"
          mkdir -p "${PKG}/usr/share/applications"
          mkdir -p "${PKG}/usr/share/icons/hicolor/256x256/apps"

          cp build/bin/ConfScope "${PKG}/usr/bin/confscope"
          chmod 755 "${PKG}/usr/bin/confscope"
          cp build/appicon.png "${PKG}/usr/share/icons/hicolor/256x256/apps/confscope.png"
          cp build/linux/confscope.desktop "${PKG}/usr/share/applications/"

          printf '%s\n' \
            "Package: confscope" \
            "Version: ${VERSION}" \
            "Section: devel" \
            "Priority: optional" \
            "Architecture: amd64" \
            "Depends: libgtk-3-0, libwebkit2gtk-4.0-37" \
            "Maintainer: ConfScope <noreply@github.com>" \
            "Description: ConfScope - 配置中心管理工具" \
            " 浏览、对比、洞察多配置中心的配置差异。" \
            > "${PKG}/DEBIAN/control"

          dpkg-deb --root-owner-group --build "${PKG}"
          mv "${PKG}.deb" "build/bin/confscope-linux-amd64.deb"

      - name: Package Linux .rpm
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get install -y rpm
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0"
          fi
          # rpm Release 带 dev 标识，避免与正式包混淆
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            RPM_RELEASE="0.dev.${GITHUB_SHA::7}"
          else
            RPM_RELEASE="1"
          fi
          TOPDIR="${HOME}/rpmbuild"
          mkdir -p "${TOPDIR}"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}

          # spec 文件
          cat > "${TOPDIR}/SPECS/confscope.spec" <<EOF
          Name:           confscope
          Version:        ${VERSION}
          Release:        ${RPM_RELEASE}%{?dist}
          Summary:        配置中心管理工具

          License:        AGPL-3.0-only
          URL:            https://github.com/${{ github.repository }}

          Requires:       gtk3
          Requires:       webkit2gtk4.0

          %description
          浏览、对比、洞察多配置中心的配置差异。

          %install
          mkdir -p %{buildroot}/usr/bin
          mkdir -p %{buildroot}/usr/share/applications
          mkdir -p %{buildroot}/usr/share/icons/hicolor/256x256/apps
          cp %{_sourcedir}/ConfScope %{buildroot}/usr/bin/confscope
          chmod 755 %{buildroot}/usr/bin/confscope
          cp %{_sourcedir}/confscope.desktop %{buildroot}/usr/share/applications/
          cp %{_sourcedir}/confscope.png %{buildroot}/usr/share/icons/hicolor/256x256/apps/

          %files
          /usr/bin/confscope
          /usr/share/applications/confscope.desktop
          /usr/share/icons/hicolor/256x256/apps/confscope.png
          EOF

          # 把构建产物放到 SOURCES
          cp build/bin/ConfScope "${TOPDIR}/SOURCES/"
          cp build/linux/confscope.desktop "${TOPDIR}/SOURCES/"
          cp build/appicon.png "${TOPDIR}/SOURCES/confscope.png"

          rpmbuild -bb "${TOPDIR}/SPECS/confscope.spec"
          cp "${TOPDIR}/RPMS/x86_64"/confscope-*.rpm "build/bin/confscope-linux-amd64.rpm"

      - name: Upload artifact (Linux)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ConfScope-linux-amd64
          path: |
            build/bin/confscope-linux-amd64.tar.gz
            build/bin/confscope-linux-amd64.deb
            build/bin/confscope-linux-amd64.rpm
          if-no-files-found: error

  generate-manifest:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    outputs:
      manifest: ${{ steps.manifest.outputs.json }}
    steps:
      # CHANGELOG 是发行说明的事实源，所以取产物之前先把 tag 自身的内容检出
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate update.json
        id: manifest
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # 发行说明取自 CHANGELOG 的对应段落（轮52）。原先这里读 gh release view 的正文，
          # 但 release 作业 needs 本作业——读的时候 Release 还没被创建，
          # 2>/dev/null || echo "" 把失败咽掉，于是 notes 恒为占位文案：
          # 线上 v1.9.1 的 update.json 实测就是 "发行版 1.9.1"。而关于页的更新面板与
          # 后台检查通知都把这段文字直接摆给用户看，等于每次升级只给用户一行空话。
          # 现在抽不到段落就非 0 退出：宁可发版构建红，也不再发一行空话。
          node --version
          NOTES="$(node scripts/extract-release-notes.mjs "${VERSION}")"
          echo "release notes for ${VERSION} (${#NOTES} chars):"
          echo "${NOTES}"

          # Windows：裸 exe（便携形态）+ NSIS 安装程序（每用户安装形态）
          WIN_SHA256=$(sha256sum "artifacts/ConfScope-windows-amd64/confscope-windows-amd64-portable.exe" | awk '{print $1}')
          WIN_INSTALLER_SHA256=$(sha256sum "artifacts/ConfScope-windows-amd64-installer/confscope-windows-amd64-installer.exe" | awk '{print $1}')

          # Linux
          LINUX_TAR_SHA256=$(sha256sum "artifacts/ConfScope-linux-amd64/confscope-linux-amd64.tar.gz" | awk '{print $1}')
          LINUX_DEB_SHA256=$(sha256sum "artifacts/ConfScope-linux-amd64/confscope-linux-amd64.deb" | awk '{print $1}')
          LINUX_RPM_SHA256=$(sha256sum "artifacts/ConfScope-linux-amd64/confscope-linux-amd64.rpm" | awk '{print $1}')

          # macOS
          DARWIN_ARM64_SHA256=$(sha256sum "artifacts/ConfScope-darwin-arm64/confscope-macos-arm64.dmg" | awk '{print $1}')
          DARWIN_AMD64_SHA256=$(sha256sum "artifacts/ConfScope-darwin-amd64/confscope-macos-amd64.dmg" | awk '{print $1}')

          DOWNLOAD_BASE="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}"

          jq -n \
            --arg version "${VERSION}" \
            --arg notes "${NOTES}" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg winSha256 "${WIN_SHA256}" \
            --arg winInstallerSha256 "${WIN_INSTALLER_SHA256}" \
            --arg linuxTarSha256 "${LINUX_TAR_SHA256}" \
            --arg linuxDebSha256 "${LINUX_DEB_SHA256}" \
            --arg linuxRpmSha256 "${LINUX_RPM_SHA256}" \
            --arg darwinArm64Sha256 "${DARWIN_ARM64_SHA256}" \
            --arg darwinAmd64Sha256 "${DARWIN_AMD64_SHA256}" \
            --arg downloadBase "${DOWNLOAD_BASE}" \
            '{
              version: $version,
              notes: $notes,
              publishedAt: $publishedAt,
              mandatory: false,
              platforms: {
                "windows-amd64": {
                  downloadUrl: "\($downloadBase)/confscope-windows-amd64-portable.exe",
                  sha256: $winSha256,
                  fileName: "confscope-windows-amd64-portable.exe"
                },
                "windows-amd64-installer": {
                  downloadUrl: "\($downloadBase)/confscope-windows-amd64-installer.exe",
                  sha256: $winInstallerSha256,
                  fileName: "confscope-windows-amd64-installer.exe"
                },
                "linux-amd64": {
                  downloadUrl: "\($downloadBase)/confscope-linux-amd64.tar.gz",
                  sha256: $linuxTarSha256,
                  fileName: "confscope-linux-amd64.tar.gz"
                },
                "linux-amd64-deb": {
                  downloadUrl: "\($downloadBase)/confscope-linux-amd64.deb",
                  sha256: $linuxDebSha256,
                  fileName: "confscope-linux-amd64.deb"
                },
                "linux-amd64-rpm": {
                  downloadUrl: "\($downloadBase)/confscope-linux-amd64.rpm",
                  sha256: $linuxRpmSha256,
                  fileName: "confscope-linux-amd64.rpm"
                },
                "darwin-arm64": {
                  downloadUrl: "\($downloadBase)/confscope-macos-arm64.dmg",
                  sha256: $darwinArm64Sha256,
                  fileName: "confscope-macos-arm64.dmg"
                },
                "darwin-amd64": {
                  downloadUrl: "\($downloadBase)/confscope-macos-amd64.dmg",
                  sha256: $darwinAmd64Sha256,
                  fileName: "confscope-macos-amd64.dmg"
                }
              }
            }' > update.json

          cat update.json
          echo "json=$(cat update.json | jq -c .)" >> $GITHUB_OUTPUT
          cp update.json artifacts/update.json

      - name: Upload update.json as artifact
        uses: actions/upload-artifact@v4
        with:
          name: update-manifest
          path: artifacts/update.json
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, generate-manifest]
    runs-on: ubuntu-latest
    steps:
      # 正文的事实源是 CHANGELOG.md（轮58）。原先这一路靠 GitHub 自动注记：它汇总的是
      # "本版本合并进来的 PR"，而本仓库不走 PR 流程，于是线上 20 个 Release 除 v1.0.0
      # （手写正文）外全只剩一行 compare 链接 —— 用户打开 releases 页看不到更新了什么。
      # 现在正文由 scripts/sync-github-release-notes.mjs 从 CHANGELOG 段落渲染，与应用内
      # 更新面板（scripts/extract-release-notes.mjs）同一份来源、同一套中文小节口径。
      # 抽不到段落就让这一步红：宁可发版失败，也别再发一行 compare 链接当发布说明。
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build release body from CHANGELOG
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/sync-github-release-notes.mjs \
            --print-body="${VERSION}" \
            --repo="${{ github.repository }}" \
            --out="${RUNNER_TEMP}/release-body.md"
          echo "----- release body -----"
          cat "${RUNNER_TEMP}/release-body.md"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          body_path: ${{ runner.temp }}/release-body.md
          files: |
            artifacts/ConfScope-windows-amd64/confscope-windows-amd64-portable.exe
            artifacts/ConfScope-windows-amd64-installer/confscope-windows-amd64-installer.exe
            artifacts/ConfScope-linux-amd64/confscope-linux-amd64.tar.gz
            artifacts/ConfScope-linux-amd64/confscope-linux-amd64.deb
            artifacts/ConfScope-linux-amd64/confscope-linux-amd64.rpm
            artifacts/ConfScope-darwin-arm64/confscope-macos-arm64.dmg
            artifacts/ConfScope-darwin-amd64/confscope-macos-amd64.dmg
            artifacts/update-manifest/update.json
